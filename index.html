<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Necessidade CM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2313231a'/%3E%3Cpath d='M10 18h30v25H10z' fill='%2322c55e'/%3E%3Cpath d='M40 27h8l7 8v8H40z' fill='%2370cf82'/%3E%3Ccircle cx='21' cy='46' r='6' fill='%23eefcf1'/%3E%3Ccircle cx='47' cy='46' r='6' fill='%23eefcf1'/%3E%3Ccircle cx='21' cy='46' r='3' fill='%2307110c'/%3E%3Ccircle cx='47' cy='46' r='3' fill='%2307110c'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #07110c;
      --panel: #13231a;
      --panel-2: #102018;
      --line: rgba(174, 221, 184, .22);
      --text: #eefcf1;
      --muted: #b7d3be;
      --green: #22c55e;
      --blue: #00b0f0;
      --yellow: #ffff00;
      --danger: #ef4444;
      --shadow: 0 18px 40px rgba(0, 0, 0, .25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(34, 197, 94, .18), transparent 28rem),
        linear-gradient(145deg, #061008, #0b1610 45%, #07110c);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .plant-picker {
      display: grid;
      gap: 5px;
      min-width: min(280px, 100%);
    }

    .plant-picker label {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .plant-select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #e9f7ee;
      color: #06200f;
      font-weight: 900;
      padding: 9px 34px 9px 11px;
      cursor: pointer;
    }

    .app {
      width: min(1520px, calc(100vw - 24px));
      margin: 0 auto;
      padding: 18px 0 28px;
      display: grid;
      gap: 14px;
    }

    .hero,
    .panel,
    .stat,
    .summary-card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(20, 38, 28, .96), rgba(13, 25, 18, .98));
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(1.35rem, 2.5vw, 2.2rem);
      letter-spacing: -.03em;
    }

    h2 {
      font-size: 1rem;
    }

    .muted {
      color: var(--muted);
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .module-nav {
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(13, 25, 18, .92);
      box-shadow: var(--shadow);
    }

    .module-tab {
      flex: 1;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 11px 14px;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
    }

    .module-tab.active {
      color: #fff;
      background: linear-gradient(135deg, #27713d, #1d5830);
      border-color: rgba(112, 207, 130, .55);
    }

    .module-page {
      display: grid;
      gap: 14px;
    }

    [hidden] { display: none !important; }

    .btn {
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 10px;
      color: #06120a;
      background: #dff7e4;
      font-weight: 900;
      padding: 9px 12px;
      cursor: pointer;
    }

    .btn.primary {
      background: linear-gradient(135deg, #70cf82, #4caf65);
      color: #fff;
    }

    .btn.danger {
      background: rgba(239, 68, 68, .18);
      color: #fecaca;
      border-color: rgba(239, 68, 68, .45);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 850;
      background: rgba(255, 255, 255, .04);
    }

    .status.good { color: #bbf7d0; }
    .status.warn { color: #fde68a; }
    .status.bad { color: #fecaca; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(145px, 1fr));
      gap: 10px;
    }

    .stat {
      padding: 13px;
      display: grid;
      gap: 5px;
      min-height: 92px;
    }

    .stat span,
    .summary-card small {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .stat strong {
      font-size: 1.55rem;
      line-height: 1;
    }

    .stat small,
    .summary-card span {
      color: #cbe8d0;
      font-size: .8rem;
    }

    .panel {
      padding: 14px;
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid rgba(174, 221, 184, .14);
    }

    .sheet-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1120px;
      background: #062018;
    }

    .sheet-table th,
    .sheet-table td {
      border: 1px solid rgba(8, 20, 14, .75);
      text-align: center;
      padding: 6px 5px;
      white-space: nowrap;
    }

    .sheet-table th {
      background: #143322;
      color: #eaffef;
      font-size: .72rem;
      text-transform: uppercase;
    }

    .sheet-cell-label {
      background: #00b050;
      color: #04140b;
      font-weight: 900;
    }

    .sheet-cell-input {
      background: var(--blue);
      color: #041018;
    }

    .sheet-cell-formula {
      background: var(--yellow);
      color: #1f1f05;
      font-weight: 900;
    }

    .sheet-cell-total {
      background: #173323;
      color: #fff;
      font-weight: 900;
    }

    .sheet-input {
      width: 100%;
      min-width: 54px;
      border: 1px solid rgba(0, 0, 0, .25);
      border-radius: 8px;
      background: rgba(255, 255, 255, .72);
      color: #061018;
      text-align: center;
      font-weight: 900;
      padding: 6px 4px;
    }

    .front-input {
      min-width: 108px;
      text-align: left;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(320px, .9fr) minmax(360px, 1.1fr);
      gap: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-card {
      padding: 14px;
      display: grid;
      gap: 6px;
      min-height: 104px;
    }

    .summary-card strong {
      font-size: 1.45rem;
    }

    .summary-card.real-fleet {
      border-color: rgba(0, 176, 240, .42);
      background: linear-gradient(180deg, rgba(9, 57, 72, .45), rgba(13, 31, 27, .96));
    }

    .summary-card.fleet-gap {
      border-color: rgba(250, 204, 21, .48);
    }

    .summary-card.fleet-ok {
      border-color: rgba(34, 197, 94, .52);
    }

    .summary-input-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-input-line .sheet-input {
      width: 110px;
      font-size: 1.15rem;
    }

    .fleet-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .fleet-field {
      display: grid;
      gap: 4px;
    }

    .fleet-field label {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .fleet-field .sheet-input { width: 100%; }

    .fleet-percent-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-top: 7px;
      border-top: 1px solid rgba(174, 221, 184, .16);
      font-size: .78rem;
      font-weight: 900;
    }

    .fleet-percent-line .running { color: #86efac; }
    .fleet-percent-line .stopped { color: #fca5a5; }

    .fleet-progress {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
    }

    .fleet-progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
    }

    .fleet-progress.stopped span { background: var(--danger); }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      max-width: min(420px, calc(100vw - 32px));
      padding: 12px 14px;
      border-radius: 12px;
      color: #06200f;
      background: #e9f7ee;
      box-shadow: 0 16px 35px rgba(0, 0, 0, .35);
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: .2s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1100px) {
      .stats-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .dashboard-grid { grid-template-columns: 1fr; }
      .hero { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
    }

    @media (max-width: 680px) {
      .stats-grid,
      .summary-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div>
        <h1 id="pageTitle">Necessidade CM</h1>
        <p class="muted" id="pageSubtitle">Sistema por unidade para calcular, salvar e enviar a necessidade de caminhões.</p>
      </div>
      <div class="actions">
        <div class="plant-picker">
          <label for="plantSelect">Unidade selecionada</label>
          <select class="plant-select" id="plantSelect"></select>
        </div>
        <span class="status warn" id="syncStatus">Carregando...</span>
        <button class="btn" id="addFrontBtn" type="button">Adicionar frente</button>
        <button class="btn primary" id="saveDbBtn" type="button">Salvar no banco</button>
        <button class="btn" id="refreshDbBtn" type="button">Atualizar do banco</button>
        <button class="btn" id="printReportBtn" type="button">Imprimir relatório</button>
        <button class="btn" id="copyWhatsBtn" type="button">Copiar WhatsApp</button>
        <button class="btn danger" id="resetBtn" type="button">Restaurar</button>
      </div>
    </section>

    <nav class="module-nav" aria-label="Cenários do sistema">
      <button class="module-tab active" type="button" data-module="transport">Cenário de Transporte</button>
      <button class="module-tab" type="button" data-module="harvest">Cenário de Colheita</button>
    </nav>

    <div class="module-page" id="transportPage">
      <section class="stats-grid" id="kpiWrap" aria-label="Indicadores principais"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>Cenário Geral</h2>
          <span class="status">Preenchimento manual</span>
        </div>
        <div class="table-wrap" id="scenarioWrap"></div>
      </section>

      <section class="dashboard-grid">
        <section class="panel">
          <div class="panel-head">
            <h2>Parâmetros</h2>
            <span class="status">Cálculo automático</span>
          </div>
          <div class="table-wrap" id="paramsWrap"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Resumo</h2>
            <span class="status">Para operação</span>
          </div>
          <div id="summaryWrap"></div>
        </section>
      </section>
    </div>

    <div class="module-page" id="harvestPage" hidden>
      <section class="stats-grid" id="harvestKpiWrap" aria-label="Indicadores de colheita"></section>
      <section class="panel">
        <div class="panel-head">
          <h2>Frentes de colheita</h2>
          <span class="status">Baseado na planilha de cenário</span>
        </div>
        <div class="table-wrap" id="harvestScenarioWrap"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>Resumo da colheita</h2>
          <span class="status">Cálculo automático</span>
        </div>
        <div id="harvestSummaryWrap"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script>
    (() => {
    if (window.__necessidadeCmInitialized) return;
    window.__necessidadeCmInitialized = true;

    const PLANTS = {
      cambui: "Usina Cambuí",
      floresta: "Usina Floresta",
      panorama: "Usina Panorama",
      vale_do_verdao: "Usina Vale do Verdão"
    };
    const LOCAL_DATA_NAMESPACE = "necessidade-de-caminhoes.v2";
    const ACTIVE_PLANT_KEY = `${LOCAL_DATA_NAMESPACE}.activePlant`;
    const ACTIVE_MODULE_KEY = `${LOCAL_DATA_NAMESPACE}.activeModule`;
    let activePlant = localStorage.getItem(ACTIVE_PLANT_KEY) || "cambui";
    if (!PLANTS[activePlant]) activePlant = "cambui";
    let activeModule = localStorage.getItem(ACTIVE_MODULE_KEY) || "transport";
    if (!['transport', 'harvest'].includes(activeModule)) activeModule = "transport";
    const APP_VERSION = "necessidade-cm-standalone-v2";

    function storageKey(plant = activePlant) {
      return `${LOCAL_DATA_NAMESPACE}.${plant}.state`;
    }

    function metaKey(plant = activePlant) {
      return `${LOCAL_DATA_NAMESPACE}.${plant}.updatedAt`;
    }

    function harvestStorageKey(plant = activePlant) {
      return `${LOCAL_DATA_NAMESPACE}.${plant}.harvestState`;
    }

    function harvestMetaKey(plant = activePlant) {
      return `${LOCAL_DATA_NAMESPACE}.${plant}.harvestUpdatedAt`;
    }

    function plantName(plant = activePlant) {
      return PLANTS[plant] || PLANTS.cambui;
    }

    const defaultFirebaseConfig = {
      apiKey: "AIzaSyDcu2jgzo4V5nvpDQwGdGOWY0nsSwCv7x8",
      authDomain: "necessidade-de-caminhoes.firebaseapp.com",
      databaseURL: "https://necessidade-de-caminhoes-default-rtdb.firebaseio.com",
      projectId: "necessidade-de-caminhoes",
      storageBucket: "necessidade-de-caminhoes.firebasestorage.app",
      messagingSenderId: "840541069370",
      appId: "1:840541069370:web:47c3797a226cd115dad503",
      measurementId: "G-WE6JXSGWXV"
    };

    const defaultState = {
      fronts: [
        { front: "Frente 1", plan: 0, radius: 0, netWeight: 0, emptySpeed: 0, loadedSpeed: 0, emptyCycle: 0, t2: 30, t4: 45, loadedCycle: 0, currentRadius: 0, fieldRoundTrips: 0 }
      ],
      params: {
        emptySpeed: 35,
        loadedSpeed: 25,
        t2: 30,
        t4: 45,
        supply: 30,
        maintenance: 30,
        shiftChange: 15,
        meal: 60,
        availability: 1305,
        operationalMinutes: 1440,
        fieldRoundTripDiscountPercent: 60,
        ownTrucksRunning: 0,
        thirdPartyTrucksRunning: 0,
        ownTrucksPlanned: 0,
        thirdPartyTrucksPlanned: 0
      }
    };

    const defaultHarvestState = {
      fronts: [
        {
          front: "Frente 1", tch: 0, spacing: 1.5, shotLength: 0, harvestSpeed: 0,
          availableHours: 15, maneuverTime: 1.5, harvesters: 0, tractors: 0,
          tractorDensity: 0, loadingTime: 0, auxiliaryTime: 0, loadDensity: 0
        }
      ],
      lossPercent: 10
    };

    const els = {
      kpiWrap: document.querySelector("#kpiWrap"),
      harvestKpiWrap: document.querySelector("#harvestKpiWrap"),
      pageTitle: document.querySelector("#pageTitle"),
      pageSubtitle: document.querySelector("#pageSubtitle"),
      transportPage: document.querySelector("#transportPage"),
      harvestPage: document.querySelector("#harvestPage"),
      moduleTabs: Array.from(document.querySelectorAll("[data-module]")),
      scenarioWrap: document.querySelector("#scenarioWrap"),
      harvestScenarioWrap: document.querySelector("#harvestScenarioWrap"),
      paramsWrap: document.querySelector("#paramsWrap"),
      summaryWrap: document.querySelector("#summaryWrap"),
      harvestSummaryWrap: document.querySelector("#harvestSummaryWrap"),
      syncStatus: document.querySelector("#syncStatus"),
      toast: document.querySelector("#toast"),
      plantSelect: document.querySelector("#plantSelect"),
      addFrontBtn: document.querySelector("#addFrontBtn"),
      saveDbBtn: document.querySelector("#saveDbBtn"),
      refreshDbBtn: document.querySelector("#refreshDbBtn"),
      printReportBtn: document.querySelector("#printReportBtn"),
      copyWhatsBtn: document.querySelector("#copyWhatsBtn"),
      resetBtn: document.querySelector("#resetBtn")
    };

    let state = loadState();
    let localUpdatedAt = localStorage.getItem(metaKey()) || "";
    let harvestState = loadHarvestState();
    let harvestLocalUpdatedAt = localStorage.getItem(harvestMetaKey()) || "";
    let db = null;

    els.plantSelect.innerHTML = Object.entries(PLANTS)
      .map(([value, label]) => `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`)
      .join("");
    els.plantSelect.value = activePlant;

    function parseNumber(value) {
      if (typeof value === "number") return Number.isFinite(value) ? value : 0;
      const clean = String(value ?? "")
        .trim()
        .replace(/\s/g, "")
        .replace(/\.(?=\d{3}(\D|$))/g, "")
        .replace(",", ".");
      const parsed = Number(clean);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatNumberFixed(value, digits = 2) {
      return new Intl.NumberFormat("pt-BR", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(parseNumber(value));
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("pt-BR", {
        maximumFractionDigits: 0
      }).format(Math.round(parseNumber(value)));
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat("pt-BR").format(value ? new Date(value) : new Date());
    }

    function formatDateTime(value) {
      return new Intl.DateTimeFormat("pt-BR", {
        dateStyle: "short",
        timeStyle: "short"
      }).format(value ? new Date(value) : new Date());
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 3600);
    }

    function setStatus(message, type = "warn") {
      els.syncStatus.textContent = message;
      els.syncStatus.className = `status ${type}`;
    }

    function cloneState(source = defaultState) {
      return {
        fronts: (source.fronts || []).map((row, index) => ({
          front: String(row.front || defaultState.fronts[index]?.front || `Frente ${index + 1}`).trim(),
          plan: parseNumber(row.plan),
          radius: parseNumber(row.radius),
          netWeight: parseNumber(row.netWeight),
          emptySpeed: parseNumber(row.emptySpeed),
          loadedSpeed: parseNumber(row.loadedSpeed),
          emptyCycle: parseNumber(row.emptyCycle),
          t2: parseNumber(row.t2 ?? source.params?.t2 ?? defaultState.params.t2),
          t4: parseNumber(row.t4 ?? source.params?.t4 ?? defaultState.params.t4),
          loadedCycle: parseNumber(row.loadedCycle),
          currentRadius: parseNumber(row.currentRadius),
          fieldRoundTrips: parseNumber(row.fieldRoundTrips)
        })),
        params: {
          emptySpeed: parseNumber(source.params?.emptySpeed ?? defaultState.params.emptySpeed),
          loadedSpeed: parseNumber(source.params?.loadedSpeed ?? defaultState.params.loadedSpeed),
          t2: parseNumber(source.params?.t2 ?? defaultState.params.t2),
          t4: parseNumber(source.params?.t4 ?? defaultState.params.t4),
          supply: parseNumber(source.params?.supply ?? defaultState.params.supply),
          maintenance: parseNumber(source.params?.maintenance ?? defaultState.params.maintenance),
          shiftChange: parseNumber(source.params?.shiftChange ?? defaultState.params.shiftChange),
          meal: parseNumber(source.params?.meal ?? defaultState.params.meal),
          availability: parseNumber(source.params?.availability ?? defaultState.params.availability),
          operationalMinutes: parseNumber(source.params?.operationalMinutes ?? defaultState.params.operationalMinutes),
          fieldRoundTripDiscountPercent: parseNumber(source.params?.fieldRoundTripDiscountPercent ?? defaultState.params.fieldRoundTripDiscountPercent),
          ownTrucksRunning: parseNumber(source.params?.ownTrucksRunning ?? defaultState.params.ownTrucksRunning),
          thirdPartyTrucksRunning: parseNumber(source.params?.thirdPartyTrucksRunning ?? defaultState.params.thirdPartyTrucksRunning),
          ownTrucksPlanned: parseNumber(source.params?.ownTrucksPlanned ?? defaultState.params.ownTrucksPlanned),
          thirdPartyTrucksPlanned: parseNumber(source.params?.thirdPartyTrucksPlanned ?? defaultState.params.thirdPartyTrucksPlanned)
        }
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(storageKey());
        return raw ? cloneState(JSON.parse(raw)) : cloneState(defaultState);
      } catch {
        return cloneState(defaultState);
      }
    }

    function persistState(updatedAt = new Date().toISOString()) {
      state = cloneState(state);
      localStorage.setItem(storageKey(), JSON.stringify(state));
      localStorage.setItem(metaKey(), updatedAt);
      localUpdatedAt = updatedAt;
    }

    function cloneHarvestState(source = defaultHarvestState) {
      return {
        fronts: (source.fronts || []).map((row, index) => ({
          front: String(row.front || `Frente ${index + 1}`).trim(),
          tch: parseNumber(row.tch),
          spacing: parseNumber(row.spacing),
          shotLength: parseNumber(row.shotLength),
          harvestSpeed: parseNumber(row.harvestSpeed),
          availableHours: parseNumber(row.availableHours),
          maneuverTime: parseNumber(row.maneuverTime),
          harvesters: parseNumber(row.harvesters),
          tractors: parseNumber(row.tractors),
          tractorDensity: parseNumber(row.tractorDensity),
          loadingTime: parseNumber(row.loadingTime),
          auxiliaryTime: parseNumber(row.auxiliaryTime),
          loadDensity: parseNumber(row.loadDensity)
        })),
        lossPercent: parseNumber(source.lossPercent ?? defaultHarvestState.lossPercent)
      };
    }

    function loadHarvestState() {
      try {
        const raw = localStorage.getItem(harvestStorageKey());
        return raw ? cloneHarvestState(JSON.parse(raw)) : cloneHarvestState(defaultHarvestState);
      } catch {
        return cloneHarvestState(defaultHarvestState);
      }
    }

    function persistHarvestState(updatedAt = new Date().toISOString()) {
      harvestState = cloneHarvestState(harvestState);
      localStorage.setItem(harvestStorageKey(), JSON.stringify(harvestState));
      localStorage.setItem(harvestMetaKey(), updatedAt);
      harvestLocalUpdatedAt = updatedAt;
    }

    function blankHarvestFront(front = "Frente 1") {
      return {
        front, tch: 0, spacing: 1.5, shotLength: 0, harvestSpeed: 0,
        availableHours: 15, maneuverTime: 1.5, harvesters: 0, tractors: 0,
        tractorDensity: 0, loadingTime: 0, auxiliaryTime: 0, loadDensity: 0
      };
    }

    function syncHarvestFrontsWithTransport() {
      const current = harvestState.fronts || [];
      const used = new Set();
      harvestState.fronts = state.fronts.map((transportFront, index) => {
        let sourceIndex = current.findIndex((row, rowIndex) => !used.has(rowIndex) && row.front === transportFront.front);
        if (sourceIndex < 0 && current[index] && !used.has(index)) sourceIndex = index;
        if (sourceIndex >= 0) used.add(sourceIndex);
        const source = sourceIndex >= 0 ? current[sourceIndex] : blankHarvestFront(transportFront.front);
        return { ...blankHarvestFront(transportFront.front), ...source, front: transportFront.front };
      });
    }

    function calculateHarvest(source = harvestState) {
      const clean = cloneHarvestState(source);
      const fronts = clean.fronts.map((row) => {
        const linearMeters = row.spacing ? 10000 / row.spacing : 0;
        const tonsPerMeter = linearMeters ? row.tch / linearMeters : 0;
        const shotTime = row.harvestSpeed ? row.shotLength * 60 / (row.harvestSpeed * 1000) : 0;
        const cycleTime = shotTime + row.maneuverTime;
        const shotsPerHour = cycleTime ? 60 / cycleTime : 0;
        const metersPerHour = shotsPerHour * row.shotLength;
        const machineProductionHour = metersPerHour * tonsPerMeter;
        const productionPerMachineDay = machineProductionHour * row.availableHours;
        const agronomicFrontProductionDay = productionPerMachineDay * row.harvesters;
        const harvesterProductionHour = row.loadingTime
          ? 60 / row.loadingTime * row.tractorDensity * row.harvesters
          : 0;
        const tractorCycle = row.loadingTime + row.auxiliaryTime;
        const tractorProductionHour = tractorCycle
          ? 60 / tractorCycle * row.tractorDensity * row.tractors
          : 0;
        const frontProductionHour = Math.min(harvesterProductionHour, tractorProductionHour);
        const trucksPerHour = row.loadDensity ? frontProductionHour / row.loadDensity : 0;
        const allocationInterval = trucksPerHour ? 60 / trucksPerHour : 0;
        const operationalFrontProductionDay = frontProductionHour * row.availableHours;
        const bottleneck = harvesterProductionHour <= tractorProductionHour ? "Colhedoras" : "Transbordos";
        return {
          ...row, linearMeters, tonsPerMeter, shotTime, cycleTime, shotsPerHour,
          metersPerHour, machineProductionHour, productionPerMachineDay,
          agronomicFrontProductionDay, harvesterProductionHour, tractorProductionHour,
          frontProductionHour, trucksPerHour, allocationInterval,
          operationalFrontProductionDay, bottleneck
        };
      });
      const grossProductionHour = fronts.reduce((sum, row) => sum + row.frontProductionHour, 0);
      const lossRate = Math.max(0, clean.lossPercent) / 100;
      const lossHour = grossProductionHour * lossRate;
      const netProductionHour = grossProductionHour - lossHour;
      const operationalProductionDay = fronts.reduce((sum, row) => sum + row.operationalFrontProductionDay, 0);
      const agronomicProductionDay = fronts.reduce((sum, row) => sum + row.agronomicFrontProductionDay, 0);
      const trucksPerHour = fronts.reduce((sum, row) => sum + row.trucksPerHour, 0);
      const harvesters = fronts.reduce((sum, row) => sum + row.harvesters, 0);
      const tractors = fronts.reduce((sum, row) => sum + row.tractors, 0);
      return {
        ...clean, fronts, grossProductionHour, lossHour, netProductionHour,
        operationalProductionDay, agronomicProductionDay, trucksPerHour,
        harvesters, tractors
      };
    }

    function calculate(source = state) {
      const clean = cloneState(source);
      const downtime = clean.params.supply + clean.params.maintenance + clean.params.shiftChange + clean.params.meal;
      const availability = clean.params.availability || Math.max(clean.params.operationalMinutes - downtime, 0);
      const discountPercent = Math.max(0, parseNumber(clean.params.fieldRoundTripDiscountPercent));
      const discountRate = discountPercent / 100;
      const fronts = clean.fronts.map((row) => {
        const emptySpeed = row.emptyCycle ? (row.radius / row.emptyCycle) * 60 : row.emptySpeed;
        const loadedSpeed = row.loadedCycle ? (row.radius / row.loadedCycle) * 60 : row.loadedSpeed;
        const cycleTotal = row.emptyCycle + row.t2 + row.t4 + row.loadedCycle;
        const frontCyclesPerCmDay = cycleTotal ? availability / cycleTotal : 0;
        const frontTripsPerDayUnit = row.netWeight ? row.plan / row.netWeight : 0;
        const frontGrossRequiredFleets = frontCyclesPerCmDay ? frontTripsPerDayUnit / frontCyclesPerCmDay : 0;
        const frontFieldRoundTripDiscount = Math.max(0, parseNumber(row.fieldRoundTrips)) * discountRate;
        const frontRequiredFleets = Math.max(frontGrossRequiredFleets - frontFieldRoundTripDiscount, 0);
        return {
          ...row,
          emptySpeed,
          loadedSpeed,
          cycleTotal,
          frontCyclesPerCmDay,
          frontTripsPerDayUnit,
          frontGrossRequiredFleets,
          frontFieldRoundTripDiscount,
          frontRequiredFleets
        };
      });

      const planTotal = fronts.reduce((sum, row) => sum + row.plan, 0);
      const weightedRadius = planTotal ? fronts.reduce((sum, row) => sum + row.radius * row.plan, 0) / planTotal : 0;
      const weightedNetWeight = planTotal ? fronts.reduce((sum, row) => sum + row.netWeight * row.plan, 0) / planTotal : 0;
      const weightedEmptySpeed = planTotal ? fronts.reduce((sum, row) => sum + row.emptySpeed * row.plan, 0) / planTotal : 0;
      const weightedLoadedSpeed = planTotal ? fronts.reduce((sum, row) => sum + row.loadedSpeed * row.plan, 0) / planTotal : 0;
      const weightedT2 = planTotal ? fronts.reduce((sum, row) => sum + row.t2 * row.plan, 0) / planTotal : 0;
      const weightedT4 = planTotal ? fronts.reduce((sum, row) => sum + row.t4 * row.plan, 0) / planTotal : 0;
      const t1 = clean.params.emptySpeed ? (weightedRadius / clean.params.emptySpeed) * 60 : 0;
      const t3 = weightedLoadedSpeed ? (weightedRadius / weightedLoadedSpeed) * 60 : 0;
      const totalCycle = t1 + weightedT2 + t3 + weightedT4;
      const cyclesPerCmDay = totalCycle ? availability / totalCycle : 0;
      const tripsPerDayUnit = weightedNetWeight ? planTotal / weightedNetWeight : 0;
      const totalFieldRoundTrips = fronts.reduce((sum, row) => sum + Math.max(0, row.fieldRoundTrips), 0);
      const grossRequiredFleets = fronts.reduce((sum, row) => sum + row.frontGrossRequiredFleets, 0);
      const fieldRoundTripDiscount = fronts.reduce((sum, row) => sum + row.frontFieldRoundTripDiscount, 0);
      const requiredFleets = fronts.reduce((sum, row) => sum + row.frontRequiredFleets, 0);
      const operationalNeed = Math.ceil(requiredFleets);
      const ownTrucksRunning = Math.max(0, clean.params.ownTrucksRunning);
      const thirdPartyTrucksRunning = Math.max(0, clean.params.thirdPartyTrucksRunning);
      const totalTrucksRunning = ownTrucksRunning + thirdPartyTrucksRunning;
      const ownTrucksPlanned = Math.max(0, clean.params.ownTrucksPlanned);
      const thirdPartyTrucksPlanned = Math.max(0, clean.params.thirdPartyTrucksPlanned);
      const ownRunningPercent = ownTrucksPlanned ? Math.min(ownTrucksRunning / ownTrucksPlanned * 100, 100) : 0;
      const ownStoppedPercent = ownTrucksPlanned ? 100 - ownRunningPercent : 0;
      const thirdPartyRunningPercent = thirdPartyTrucksPlanned ? Math.min(thirdPartyTrucksRunning / thirdPartyTrucksPlanned * 100, 100) : 0;
      const thirdPartyStoppedPercent = thirdPartyTrucksPlanned ? 100 - thirdPartyRunningPercent : 0;
      const totalTrucksPlanned = ownTrucksPlanned + thirdPartyTrucksPlanned;
      const totalTrucksStopped = Math.max(totalTrucksPlanned - totalTrucksRunning, 0);
      const runningPercent = totalTrucksPlanned ? Math.min(totalTrucksRunning / totalTrucksPlanned * 100, 100) : 0;
      const stoppedPercent = totalTrucksPlanned ? 100 - runningPercent : 0;
      const fleetBalance = totalTrucksRunning - operationalNeed;

      return {
        ...clean,
        fronts,
        planTotal,
        weightedRadius,
        weightedNetWeight,
        weightedEmptySpeed,
        weightedLoadedSpeed,
        weightedT2,
        weightedT4,
        t1,
        t3,
        totalCycle,
        downtime,
        availability,
        cyclesPerCmDay,
        tripsPerDayUnit,
        grossRequiredFleets,
        totalFieldRoundTrips,
        fieldRoundTripDiscountPercent: discountPercent,
        fieldRoundTripDiscount,
        requiredFleets,
        operationalNeed,
        ownTrucksRunning,
        thirdPartyTrucksRunning,
        totalTrucksRunning,
        ownTrucksPlanned,
        thirdPartyTrucksPlanned,
        ownRunningPercent,
        ownStoppedPercent,
        thirdPartyRunningPercent,
        thirdPartyStoppedPercent,
        totalTrucksPlanned,
        totalTrucksStopped,
        runningPercent,
        stoppedPercent,
        fleetBalance
      };
    }

    function updateValue(target) {
      if (target.dataset.row !== undefined) {
        const index = Number(target.dataset.row);
        const field = target.dataset.field;
        if (!state.fronts[index] || !field) return;
        state.fronts[index][field] = field === "front"
          ? String(target.value || "").trim() || `Frente ${index + 1}`
          : parseNumber(target.value);
      } else if (target.dataset.param) {
        state.params[target.dataset.param] = parseNumber(target.value);
      }
    }

    function addFront() {
      state.fronts.push({
        front: `Frente ${state.fronts.length + 1}`,
        plan: 0,
        radius: 0,
        netWeight: 0,
        emptySpeed: 0,
        loadedSpeed: 0,
        emptyCycle: 0,
        t2: parseNumber(state.params.t2),
        t4: parseNumber(state.params.t4),
        loadedCycle: 0,
        currentRadius: 0,
        fieldRoundTrips: 0
      });
      persistState();
      syncHarvestFrontsWithTransport();
      persistHarvestState();
      render();
      renderHarvest();
      showToast("Frente adicionada.");
    }

    function deleteFront(index) {
      if (!state.fronts[index]) return;
      state.fronts.splice(index, 1);
      persistState();
      syncHarvestFrontsWithTransport();
      persistHarvestState();
      render();
      renderHarvest();
      showToast("Frente excluída.");
    }

    function updateHarvestValue(target) {
      if (target.dataset.harvestRow !== undefined) {
        const index = Number(target.dataset.harvestRow);
        const field = target.dataset.harvestField;
        if (!harvestState.fronts[index] || !field) return;
        harvestState.fronts[index][field] = field === "front"
          ? String(target.value || "").trim() || `Frente ${index + 1}`
          : parseNumber(target.value);
      } else if (target.dataset.harvestParam) {
        harvestState[target.dataset.harvestParam] = parseNumber(target.value);
      }
    }

        </head><body><header><div><h1>Cenário de Colheita</h1><p>${escapeHtml(plantName())}</p></div><strong>${escapeHtml(formatDateTime(new Date()))}</strong></header>
        <section class="kpis">
          <div class="kpi"><span>Produção líquida</span><strong>${formatNumberFixed(data.netProductionHour, 2)} t/h</strong></div>
          <div class="kpi"><span>Capacidade operacional</span><strong>${formatNumber(data.operationalProductionDay)} t/dia</strong></div>
          <div class="kpi"><span>Capacidade agronômica</span><strong>${formatNumber(data.agronomicProductionDay)} t/dia</strong></div>
          <div class="kpi"><span>Caminhões por hora</span><strong>${formatNumberFixed(data.trucksPerHour, 2)}</strong></div>
        </section>
        <table><thead><tr><th>Frente</th><th>TCH</th><th>Colhedoras</th><th>Transbordos</th><th>Prod. colhedoras</th><th>Prod. transbordos</th><th>Prod. frente</th><th>Gargalo</th><th>Caminhões/h</th><th>Intervalo</th><th>Cap. agronômica/dia</th></tr></thead>
        <tbody>${data.fronts.map((row) => `<tr><td>${escapeHtml(row.front)}</td><td>${formatNumberFixed(row.tch, 1)}</td><td>${formatNumber(row.harvesters)}</td><td>${formatNumber(row.tractors)}</td><td>${formatNumberFixed(row.harvesterProductionHour, 2)}</td><td>${formatNumberFixed(row.tractorProductionHour, 2)}</td><td>${formatNumberFixed(row.frontProductionHour, 2)}</td><td>${row.frontProductionHour ? escapeHtml(row.bottleneck) : "—"}</td><td>${formatNumberFixed(row.trucksPerHour, 2)}</td><td>${row.allocationInterval ? `${formatNumberFixed(row.allocationInterval, 1)} min` : "—"}</td><td>${formatNumber(row.agronomicFrontProductionDay)}</td></tr>`).join("")}</tbody></table>
        </body></html>`;
    }

    function printReport() {
      activeModule === "harvest" ? renderHarvest() : render();
      const frame = document.createElement("iframe");
      frame.style.position = "fixed";
      frame.style.right = "0";
      frame.style.bottom = "0";
      frame.style.width = "0";
      frame.style.height = "0";
      frame.style.border = "0";
      frame.setAttribute("aria-hidden", "true");
      document.body.appendChild(frame);
      const frameWindow = frame.contentWindow;
      const frameDocument = frame.contentDocument || (frameWindow ? frameWindow.document : null);
      if (!frameWindow || !frameDocument) {
        frame.remove();
        showToast("Não foi possível gerar o relatório neste navegador.");
        return;
      }
      frameDocument.open();
      frameDocument.write(activeModule === "harvest" ? harvestReportHtml() : reportHtml());
      frameDocument.close();
      setTimeout(() => {
        frameWindow.focus();
        frameWindow.print();
        setTimeout(() => frame.remove(), 1000);
      }, 250);
    }

    async function copyWhatsApp() {
      const text = activeModule === "harvest" ? harvestWhatsAppText() : whatsAppText();
      try {
        await navigator.clipboard.writeText(text);
        showToast("Resumo copiado para enviar no WhatsApp.");
      } catch {
        window.prompt("Copie o resumo abaixo:", text);
      }
    }

    function ensureFirebase() {
      if (db) return true;
      if (!window.firebase || !window.firebase.initializeApp || !window.firebase.database) {
        setStatus("Banco indisponível", "bad");
        return false;
      }
      try {
        const appName = "necessidade-cm-standalone";
        const app = window.firebase.apps.find((item) => item.name === appName)
          || window.firebase.initializeApp(defaultFirebaseConfig, appName);
        db = app.database();
        setStatus("Banco pronto", "good");
        return true;
      } catch (error) {
        setStatus("Erro no banco", "bad");
        showToast(`Falha ao conectar no banco: ${error.message || error}`);
        return false;
      }
    }

    function rootRef() {
      return db.ref(`productionApps/${activePlant}`);
    }

    async function saveToDatabase() {
      persistState();
      syncHarvestFrontsWithTransport();
      persistHarvestState();
      if (!ensureFirebase()) return;
      const now = new Date().toISOString();
      setStatus("Salvando...", "warn");
      try {
        await rootRef().update({
          plant: activePlant,
          version: APP_VERSION,
          updatedAt: now,
          needCmUpdatedAt: now,
          needCmState: cloneState(state),
          harvestUpdatedAt: now,
          harvestState: cloneHarvestState(harvestState)
        });
        const harvestConfirmation = await rootRef().child("harvestState").get();
        if (!harvestConfirmation.exists()) {
          throw new Error("O banco não confirmou o salvamento do Cenário de Colheita.");
        }
        persistState(now);
        persistHarvestState(now);
        setStatus(`Salvo ${formatDateTime(now)}`, "good");
        render();
        renderHarvest();
        showToast(`${activeModule === "harvest" ? "Cenário de Colheita" : "Transporte e Colheita"} salvo e confirmado no banco.`);
      } catch (error) {
        setStatus("Falha ao salvar", "bad");
        showToast(`Não foi possível salvar no banco: ${error.message || error}`);
      }
    }

    async function loadFromDatabase() {
      if (!ensureFirebase()) return;
      setStatus("Atualizando...", "warn");
      try {
        const snapshot = await rootRef().get();
        const data = snapshot.exists() ? snapshot.val() || {} : {};
        if (data.version !== APP_VERSION || (!data.needCmState && !data.harvestState)) {
          setStatus("Sem dados no banco", "warn");
          showToast(`Nenhum dado novo encontrado para ${plantName()}.`);
          return;
        }
        if (data.needCmState) {
          state = cloneState(data.needCmState);
          persistState(data.needCmUpdatedAt || data.updatedAt || new Date().toISOString());
        }
        if (data.harvestState) {
          harvestState = cloneHarvestState(data.harvestState);
          persistHarvestState(data.harvestUpdatedAt || data.updatedAt || new Date().toISOString());
        }
        syncHarvestFrontsWithTransport();
        persistHarvestState(data.harvestUpdatedAt || data.updatedAt || new Date().toISOString());
        render();
        renderHarvest();
        const currentUpdatedAt = activeModule === "harvest" ? harvestLocalUpdatedAt : localUpdatedAt;
        setStatus(`Atualizado ${formatDateTime(currentUpdatedAt)}`, "good");
        showToast("Dados carregados do banco.");
      } catch (error) {
        setStatus("Falha ao atualizar", "bad");
        showToast(`Não foi possível atualizar do banco: ${error.message || error}`);
      }
    }

    function changePlant(plant) {
      if (!PLANTS[plant] || plant === activePlant) return;
      activePlant = plant;
      localStorage.setItem(ACTIVE_PLANT_KEY, activePlant);
      state = loadState();
      localUpdatedAt = localStorage.getItem(metaKey()) || "";
      harvestState = loadHarvestState();
      harvestLocalUpdatedAt = localStorage.getItem(harvestMetaKey()) || "";
      syncHarvestFrontsWithTransport();
      persistHarvestState(harvestLocalUpdatedAt || new Date().toISOString());
      render();
      renderHarvest();
      const currentUpdatedAt = activeModule === "harvest" ? harvestLocalUpdatedAt : localUpdatedAt;
      setStatus(currentUpdatedAt ? `Local ${formatDateTime(currentUpdatedAt)}` : "Sem dados locais", currentUpdatedAt ? "good" : "warn");
      showToast(`${plantName()} selecionada. Os dados desta unidade estão separados.`);
    }

    function changeModule(module) {
      if (!['transport', 'harvest'].includes(module) || module === activeModule) return;
      activeModule = module;
      localStorage.setItem(ACTIVE_MODULE_KEY, activeModule);
      if (activeModule === "harvest") renderHarvest();
      updatePageChrome();
      const currentUpdatedAt = activeModule === "harvest" ? harvestLocalUpdatedAt : localUpdatedAt;
      setStatus(currentUpdatedAt ? `Local ${formatDateTime(currentUpdatedAt)}` : "Banco pronto", "good");
    }

    [els.scenarioWrap, els.paramsWrap].forEach((wrap) => {
      wrap.addEventListener("input", (event) => {
        const input = event.target.closest("[data-field], [data-param]");
        if (!input) return;
        updateValue(input);
        refreshOutputs();
      });

      wrap.addEventListener("change", (event) => {
        const input = event.target.closest("[data-field], [data-param]");
        if (!input) return;
        updateValue(input);
        persistState();
        syncHarvestFrontsWithTransport();
        persistHarvestState();
        refreshOutputs();
        renderHarvest();
      });
    });

    els.summaryWrap.addEventListener("input", (event) => {
      const input = event.target.closest("[data-param]");
      if (!input) return;
      updateValue(input);
    });

    els.summaryWrap.addEventListener("change", (event) => {
      const input = event.target.closest("[data-param]");
      if (!input) return;
      updateValue(input);
      persistState();
      refreshOutputs();
    });

    els.scenarioWrap.addEventListener("click", (event) => {
      const button = event.target.closest("[data-delete]");
      if (!button) return;
      deleteFront(Number(button.dataset.delete));
    });

    [els.harvestScenarioWrap, els.harvestSummaryWrap].forEach((wrap) => {
      wrap.addEventListener("input", (event) => {
        const input = event.target.closest("[data-harvest-field], [data-harvest-param]");
        if (!input) return;
        updateHarvestValue(input);
      });
      wrap.addEventListener("change", (event) => {
        const input = event.target.closest("[data-harvest-field], [data-harvest-param]");
        if (!input) return;
        updateHarvestValue(input);
        persistHarvestState();
        renderHarvest();
      });
    });

    els.moduleTabs.forEach((tab) => tab.addEventListener("click", () => changeModule(tab.dataset.module)));
    els.addFrontBtn.addEventListener("click", () => activeModule === "harvest" ? changeModule("transport") : addFront());
    els.plantSelect.addEventListener("change", (event) => changePlant(event.target.value));
    els.saveDbBtn.addEventListener("click", saveToDatabase);
    els.refreshDbBtn.addEventListener("click", loadFromDatabase);
    els.printReportBtn.addEventListener("click", printReport);
    els.copyWhatsBtn.addEventListener("click", copyWhatsApp);
    els.resetBtn.addEventListener("click", () => {
      const label = activeModule === "harvest" ? "Cenário de Colheita" : "Necessidade CM";
      if (!confirm(`Restaurar os dados padrão de ${label}?`)) return;
      if (activeModule === "harvest") {
        harvestState = cloneHarvestState(defaultHarvestState);
        persistHarvestState();
        renderHarvest();
      } else {
        state = cloneState(defaultState);
        persistState();
        render();
      }
      showToast(`${label} restaurado.`);
    });

    render();
    renderHarvest();
    updatePageChrome();
    setTimeout(() => {
      const currentUpdatedAt = activeModule === "harvest" ? harvestLocalUpdatedAt : localUpdatedAt;
      if (ensureFirebase()) setStatus(currentUpdatedAt ? `Local ${formatDateTime(currentUpdatedAt)}` : "Banco pronto", "good");
    }, 300);
    })();
  </script>
</body>
</html>
